[theme]
# Light theme (default) — non-white background with WCAG-friendly contrast
primaryColor = "#2563EB"           # Blue 600
backgroundColor = "#F4F6FB"        # Soft cool gray tint (not pure white)
secondaryBackgroundColor = "#FFFFFF"
textColor = "#0F172A"              # Slate 900
font = "sans serif"

# Uncomment to force dark theme by default
# base = "dark"
# primaryColor = "#60A5FA"
# backgroundColor = "#0B1220"
# secondaryBackgroundColor = "#1F2937"
# textColor = "#E5E7EB"
